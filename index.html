<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earn Task Panel</title>
<style>
:root{--p:#6c3fc5;--pl:#efe9fb;--bg:#f5f2fc;--t:#1d1633;--m:#6b647d;--g:#1fa95b;--r:#d93636;--y:#fff3c4}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--t);padding-bottom:84px;max-width:560px;margin:auto}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;position:sticky;top:0;z-index:5}
.top b{flex:1;font-size:17px}
.ic{width:40px;height:40px;border-radius:50%;border:0;background:var(--pl);color:var(--p);font-weight:700;font-size:16px}
.wrap{padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #6c3fc522}
.bal{background:linear-gradient(135deg,#5b2fb0,#8a58e0);color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.bal small{opacity:.8}.bal h1{font-size:30px;margin:2px 0 12px}
.bal .r{display:flex;justify-content:space-between;align-items:end}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--p);color:#fff;font-weight:600;font-size:15px}
.btn.w{background:#fff;color:var(--p)}.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.s{background:var(--pl);color:var(--p)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}.btn.full{width:100%}
input,select,textarea{width:100%;padding:12px;border:1px solid #d9d2ea;border-radius:12px;font-size:15px;margin-bottom:10px;background:#fff}
label.c{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:14px}label.c input{width:auto;margin:0}
.ban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin-bottom:14px}
.ban a{flex:0 0 92%;scroll-snap-align:center}.ban img{width:100%;border-radius:16px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chip{border:0;white-space:nowrap;padding:9px 16px;border-radius:20px;background:#fff;font-size:14px}.chip.on{background:var(--p);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.earn{background:#e4e7ff;border-radius:8px;padding:6px 10px}.earn b{color:var(--r);font-size:18px}
.logo{width:56px;height:56px;border-radius:12px;border:1px solid #e3ddf2;object-fit:contain;background:#fff}
small,.mut{color:var(--m);font-size:13px}
.tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;background:var(--y);color:#8a6100}
.tag.success,.tag.paid,.tag.verified{background:#d8f5e3;color:#13763c}.tag.rejected{background:#fde0e0;color:#a31f1f}.tag.progress{background:#dde8ff;color:#2450b3}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;display:flex;justify-content:space-around;padding:8px 0 10px;box-shadow:0 -2px 10px #0001}
.nav button{border:0;background:0;color:var(--m);font-size:13px;padding:6px 14px}.nav button.on{color:var(--p);font-weight:700}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal .sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none;max-width:90%}
.msgs{height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--pl);align-self:flex-start}.m.me{background:var(--p);color:#fff;align-self:flex-end}
.m.call{background:var(--y);color:#7a5500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.abar{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff}
.center{min-height:100vh;display:flex;align-items:center;padding:16px}.center .card{width:100%}
a.lk{color:var(--p);font-size:14px;text-decoration:none}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,onSnapshot,serverTimestamp,increment,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== 1) APNA FIREBASE CONFIG YAHAN PASTE KARO ====== */
const cfg={apiKey:"AIzaSyBsQQISWytoT-T-U77CrNhfcwv85MBSqMc",authDomain:"earn-task-panel-4f2a.firebaseapp.com",projectId:"earn-task-panel-4f2a",storageBucket:"earn-task-panel-4f2a.firebasestorage.app",messagingSenderId:"708465175257",appId:"1:708465175257:web:67fca7a30ca9680694ecc8"};
/* ====== 2) ADMIN UID (firestore.rules me bhi same hai) ====== */
const ADMIN_UID="mhbUV55KE6Mw1aeqwGpRpyHZYbh1";
const MIN_WD=100;

const db=getFirestore(initializeApp(cfg)),auth=getAuth();
const $=i=>document.getElementById(i);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'₹'+Number(n||0).toFixed(2),R0=n=>'₹'+Number(n||0);
const dt=t=>t?.toDate?t.toDate().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'';
const P=new URLSearchParams(location.search);
const CATS=[['all','All'],['other','Other App'],['upi','UPI'],['saving','Saving Account'],['demat','Demat Account']];
const BANKS={"State Bank of India":"SBIN","HDFC Bank":"HDFC","ICICI Bank":"ICIC","Axis Bank":"UTIB","Punjab National Bank":"PUNB","Bank of Baroda":"BARB","Canara Bank":"CNRB","Union Bank":"UBIN","Kotak Mahindra":"KKBK","IndusInd Bank":"INDB","Yes Bank":"YESB","IDBI Bank":"IBKL","Bank of India":"BKID","Indian Bank":"IDIB","Central Bank":"CBIN","IDFC First":"IDFB","Federal Bank":"FDRL","India Post Payments":"IPOS","Paytm Payments Bank":"PYTM"};
let S={u:null,uid:null,admin:false,apps:[],banners:[],vids:[],leads:[],wds:[],users:[],chats:[],tab:'home',cat:'all',at:'users',q:'',lf:null,pm:'bank'},subs=[],chatSub=null;

window.toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)};
window.modal=h=>{const m=$('modal');m.innerHTML=`<div class="sheet">${h}</div>`;m.style.display='flex';m.onclick=ev=>{if(ev.target==m)closeM()}};
window.closeM=()=>{$('modal').style.display='none';$('modal').innerHTML='';chatSub&&chatSub();chatSub=null};
const val=i=>($(i)?.value||'').trim();
const mob=v=>/^[6-9]\d{9}$/.test(v),mail=v=>/^[^\s'"<>\\\/]+@[^\s'"<>\\\/]+\.[a-z]{2,}$/i.test(v);
const rnd=()=>String(Math.floor(1e7+Math.random()*9e7));
const draw=()=>{if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()};
const listen=(q,fn)=>subs.push(onSnapshot(q,s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));draw()},er=>console.warn(er.message)));

/* ================= AUTH + DATA ================= */
onAuthStateChanged(auth,async u=>{
 subs.forEach(f=>f());subs=[];
 if(!u){S.u=null;S.uid=null;return render()}
 S.uid=u.uid;S.admin=u.uid==ADMIN_UID;
 listen(collection(db,'apps'),a=>S.apps=a);listen(collection(db,'banners'),a=>S.banners=a);listen(collection(db,'videos'),a=>S.vids=a);
 subs.push(onSnapshot(doc(db,'users',u.uid),s=>{S.u=s.exists()?{id:s.id,...s.data()}:null;if(!s.exists()&&S.admin)setDoc(doc(db,'users',u.uid),{name:(u.email||'Admin').split('@')[0],mobile:'',email:u.email||'',code:rnd(),referredBy:null,commission:10,balance:0,earned:0,payStatus:'none',pay:{},createdAt:serverTimestamp()}).catch(x=>toast(x.message));draw()}));
 if(S.admin){listen(collection(db,'users'),a=>S.users=a);listen(collection(db,'leads'),a=>S.leads=a);listen(collection(db,'withdrawals'),a=>S.wds=a);listen(collection(db,'chats'),a=>S.chats=a)}
 else{listen(query(collection(db,'leads'),where('userId','==',u.uid)),a=>S.leads=a);listen(query(collection(db,'withdrawals'),where('userId','==',u.uid)),a=>S.wds=a)}
});
window.addEventListener('hashchange',render);

window.reg_=async()=>{
 const name=val('rn'),m=val('rm'),em=val('re').toLowerCase(),pw=val('rp');
 if(name.length<3)return toast('Enter full name');if(!mob(m))return toast('Enter valid 10 digit mobile');if(!mail(em))return toast('Enter valid Gmail');
 if(pw.length<6)return toast('Password min 6 characters');if(pw!=val('rc'))return toast('Passwords do not match');
 try{
  if((await getDoc(doc(db,'lookup','p_'+m))).exists())return toast('Mobile already registered');
  let ref=null;
  if($('rchk').checked){const c=val('rcode');const s=await getDoc(doc(db,'lookup','c_'+c));if(!s.exists())return toast('Invalid referral code');ref=s.data().uid}
  const cr=await createUserWithEmailAndPassword(auth,em,pw),uid=cr.user.uid,code=rnd();
  await setDoc(doc(db,'users',uid),{name,mobile:m,email:em,code,referredBy:ref,commission:10,balance:0,earned:0,payStatus:'none',pay:{},createdAt:serverTimestamp()});
  await setDoc(doc(db,'lookup','p_'+m),{uid,email:em});await setDoc(doc(db,'lookup','c_'+code),{uid,email:em});
  toast('Account created')
 }catch(x){toast(x.code=='auth/email-already-in-use'?'Gmail already registered':x.message)}
};
async function emailOf(id){id=id.trim().toLowerCase();if(/^\d{10}$/.test(id)){const s=await getDoc(doc(db,'lookup','p_'+id));return s.exists()?s.data().email:null}return id}
window.login_=async()=>{try{const em=await emailOf(val('li'));if(!em)return toast('Mobile not registered');await signInWithEmailAndPassword(auth,em,val('lp'))}catch(x){toast('Wrong Gmail/mobile or password')}};
window.forgot_=async()=>{try{const em=await emailOf(val('li'));if(!em||!mail(em))return toast('Enter your Gmail or registered mobile above first');await sendPasswordResetEmail(auth,em);toast('Password reset link sent to '+em.replace(/(.).+(@.+)/,'$1***$2'))}catch(x){toast('Could not send reset email')}};
window.logout_=()=>{closeM();signOut(auth)};
window.sw=m=>{S.mode=m;render()};

/* ================= CUSTOMER LEAD PAGE ================= */
async function customer(){
 const s=await getDoc(doc(db,'apps',P.get('lead')));
 if(!s.exists()){$('app').innerHTML='<div class="center"><div class="card">This offer is not available.</div></div>';return}
 const a={id:s.id,...s.data()},g=a.verifyBy=='gmail';
 $('app').innerHTML=`<div class="center"><div class="card"><div class="row" style="justify-content:flex-start"><img class="logo" src="${e(a.icon||'')}" onerror="this.style.display='none'"><div><h3>${e(a.name)}</h3><small>${e(a.desc||'')}</small></div></div><br>
 <p style="margin-bottom:8px">${g?'Enter your Gmail used for this app':'Enter your mobile number'}</p>
 <input id="cc" ${g?'type="email" placeholder="you@gmail.com"':'type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number"'}>
 <label class="c"><input type="checkbox" id="ck"> I agree my ${g?'Gmail':'number'} can be used to verify this offer</label>
 <button class="btn full" onclick="cust_()">Confirm</button></div></div>`;
 window.cust_=async()=>{
  let c=val('cc').toLowerCase();
  if(g?!/@gmail\.com$/.test(c)||!mail(c):!mob(c))return toast(g?'Enter valid Gmail':'Enter valid mobile');
  if(!$('ck').checked)return toast('Please accept the consent');
  try{await setDoc(doc(db,'leads',a.id+'_'+c),{userId:P.get('ref')||'',appId:a.id,appName:a.name,reward:Number(a.reward),contact:c,verifyBy:a.verifyBy||'mobile',status:'added',paid:false,createdAt:serverTimestamp()});
   toast('Confirmed! Redirecting...');setTimeout(()=>location.href=a.link,900)
  }catch(x){toast('This '+(g?'Gmail':'number')+' is already registered for this offer')}
 }
}

/* ================= RENDER ================= */
function render(){
 if(P.get('lead'))return customer();
 if(!S.uid)return authPage();
 if(!S.u)return $('app').innerHTML='<div class="wrap">Loading...</div>';
 if(S.admin&&location.hash=='#admin')return adminPage();
 userPage();
}
function authPage(){
 const L=S.mode!='reg';
 $('app').innerHTML=`<div class="center"><div class="card"><h2 style="margin-bottom:14px">${L?'Login':'Create account'}</h2>${L?`
 <input id="li" placeholder="Gmail or mobile number"><input id="lp" type="password" placeholder="Password">
 <button class="btn full" onclick="login_()">Login</button>
 <p style="margin:12px 0"><a class="lk" href="#" onclick="forgot_();return false">Forgot password? Send reset link to Gmail</a></p>
 <p class="mut">New here? <a class="lk" href="#" onclick="sw('reg');return false">Register</a></p>`:`
 <input id="rn" placeholder="Full name"><input id="rm" type="tel" inputmode="numeric" maxlength="10" placeholder="Mobile number">
 <input id="re" type="email" placeholder="Gmail"><input id="rp" type="password" placeholder="Create password"><input id="rc" type="password" placeholder="Confirm password">
 <label class="c"><input type="checkbox" id="rchk" onchange="$('rcode').style.display=this.checked?'block':'none'"> I have a referral code</label>
 <input id="rcode" inputmode="numeric" placeholder="Referral code" style="display:none" value="${e(P.get('invite')||'')}">
 <button class="btn full" onclick="reg_()">Register</button>
 <p class="mut" style="margin-top:12px">Already have an account? <a class="lk" href="#" onclick="sw('login');return false">Login</a></p>`}</div></div>`;
}

function userPage(){
 const u=S.u,T=S.tab;let b='';
 if(T=='home'){
  const ap=S.apps.filter(a=>S.cat=='all'||a.category==S.cat);
  b=`<div class="bal"><div class="row"><div><small>Balance</small><h1>${R(u.balance)}</h1></div><button class="btn w" onclick="wd_()">Withdraw</button></div><div class="row"><small>Total earning</small><b>${R(u.earned)}</b></div></div>
  ${S.banners.length?`<div class="ban">${S.banners.map(x=>`<a ${x.link?`href="${e(x.link)}" target="_blank"`:''}><img src="${e(x.img)}"></a>`).join('')}</div>`:''}
  <div class="chips">${CATS.map(c=>`<button class="chip ${S.cat==c[0]?'on':''}" onclick="S_('cat','${c[0]}')">${c[1]}</button>`).join('')}</div>
  ${ap.map(a=>`<div class="card"><div class="row"><span class="earn">Earn upto <b>${R0(a.reward)}</b></span><button class="ic" style="width:32px;height:32px" onclick="info('${a.id}')">i</button></div><br>
  <div class="row" style="justify-content:flex-start"><img class="logo" src="${e(a.icon||'')}" onerror="this.style.visibility='hidden'"><div><b>${e(a.name)}</b><br><small>${e(a.desc||'')}</small></div></div><br>
  <button class="btn full" onclick="share('${a.id}')">Register</button></div>`).join('')||'<p class="mut">No offers yet.</p>'}`;
 }else if(T=='leads'){
  const L=[...S.leads].sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0)),c=s=>L.filter(l=>l.status==s).length;
  const lbl={added:'Lead added',progress:'In progress',success:'Success',rejected:'Rejected'};
  b=`<div class="card"><small>TOTAL LEADS</small><h2>${L.length}</h2><div class="row" style="text-align:center;margin-top:10px"><div><b>${c('success')}</b><br><small>Success</small></div><div><b>${c('progress')+c('added')}</b><br><small>In progress</small></div><div><b>${c('rejected')}</b><br><small>Rejected</small></div></div></div>
  ${L.map(l=>`<div class="card"><div class="row"><b>${e(l.appName)}</b><span class="tag ${l.status}">${lbl[l.status]}</span></div><small>${e(l.contact)} · ${dt(l.createdAt)}</small><br><small>Expected payout </small><b style="color:var(--g)">${R0(l.reward)}</b>${l.paid?' <small>(paid)</small>':''}</div>`).join('')}
  <h3 style="margin:14px 0 8px">Withdrawals</h3>${S.wds.map(w=>`<div class="card row"><div><b>${R(w.amount)}</b><br><small>${e(w.method)} · ${dt(w.createdAt)}</small></div><span class="tag ${w.status}">${w.status}</span></div>`).join('')||'<p class="mut">No withdrawals yet.</p>'}`;
 }else b=S.vids.map(v=>`<div class="card"><b>${e(v.title)}</b><br><br>${yt(v.url)}</div>`).join('')||'<p class="mut">Training videos will appear here.</p>';
 $('app').innerHTML=`<div class="top"><button class="ic" onclick="profile()">${e(u.name[0]).toUpperCase()}</button><b>Hi, ${e(u.name.split(' ')[0])}</b><button class="ic" onclick="chat('${S.uid}','${e(u.name)}','${u.mobile}',false)">🎧</button></div><div class="wrap">${b}</div>
 <div class="nav">${[['home','Home'],['leads','My Leads'],['train','Training']].map(n=>`<button class="${T==n[0]?'on':''}" onclick="S_('tab','${n[0]}')">${n[1]}</button>`).join('')}</div>`;
}
const yt=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?`<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe>`:`<a class="lk" href="${e(u)}" target="_blank">Open video</a>`};
window.S_=(k,v)=>{S[k]=v;render()};

window.info=id=>{const a=S.apps.find(x=>x.id==id);modal(`<h3>${e(a.name)}</h3><p class="mut" style="margin:6px 0">Reward ${R0(a.reward)} · Verification by ${a.verifyBy=='gmail'?'Gmail':'mobile number'}</p><p style="white-space:pre-wrap">${e(a.details||a.desc||'')}</p><h4 style="margin-top:12px">Terms & conditions</h4><p class="mut" style="white-space:pre-wrap">${e(a.terms||'-')}</p><br><button class="btn full" onclick="closeM()">Close</button>`)};
window.share=id=>{const l=location.origin+location.pathname+`?lead=${id}&ref=${S.uid}`;modal(`<h3>Share to customer</h3><p class="mut" style="margin:6px 0 10px">Customer opens this link, confirms and gets redirected to the offer.</p><input id="sl" readonly value="${l}"><div class="row"><button class="btn s full" onclick="navigator.clipboard.writeText($('sl').value);toast('Link copied')">Copy</button><button class="btn full" onclick="navigator.share?navigator.share({url:$('sl').value}):toast('Copy the link')">Share</button></div>`)};

window.profile=()=>{const u=S.u;modal(`<h3>${e(u.name)}</h3><p class="mut">${u.mobile} · ${e(u.email)}</p><p style="margin:8px 0">Referral code: <b>${u.code}</b></p><p>Payment: <span class="tag ${u.payStatus=='verified'?'verified':''}">${{none:'Not added',pending:'Under verification',verified:'Verified ✓'}[u.payStatus]}</span></p><br>
 <button class="btn full" onclick="payDet()">Payment details</button><br><br>${S.admin?'<a class="btn s full" style="display:block;text-align:center;text-decoration:none" href="#admin" onclick="closeM()">Admin panel</a><br>':''}<button class="btn r full" onclick="logout_()">Logout</button>`)};

/* ---- payment details ---- */
window.payDet=()=>{
 const m=S.pm,p=S.u.pay?.[m]||{};
 const tabs=`<div class="chips">${[['bank','Bank account'],['upi','UPI'],['usdt','Crypto USDT']].map(x=>`<button class="chip ${m==x[0]?'on':''}" onclick="S.pm='${x[0]}';payDet()">${x[1]}</button>`).join('')}</div>`;
 const f={bank:`<select id="pb" onchange="ifsc()"><option value="">Select bank</option>${Object.keys(BANKS).map(k=>`<option ${p.bank==k?'selected':''}>${k}</option>`).join('')}</select>
  <input id="pa" type="tel" inputmode="numeric" placeholder="Account number" value="${e(p.acc||'')}"><input id="pa2" type="tel" inputmode="numeric" placeholder="Confirm account number" value="${e(p.acc||'')}">
  <input id="pi" list="ifl" placeholder="IFSC code" style="text-transform:uppercase" maxlength="11" value="${e(p.ifsc||'')}"><datalist id="ifl">${Object.values(BANKS).map(c=>`<option value="${c}0">`).join('')}</datalist>
  <input id="pm" type="tel" inputmode="numeric" maxlength="10" placeholder="Bank linked mobile" value="${e(p.mobile||'')}"><input id="pn" placeholder="Full name as per bank account" value="${e(p.name||'')}">`,
  upi:`<input id="pu" placeholder="UPI ID (name@bank)" value="${e(p.id||'')}"><input id="pn" placeholder="Name on UPI" value="${e(p.name||'')}">`,
  usdt:`<select id="pw"><option ${p.net=='TRC20'?'selected':''}>TRC20</option><option ${p.net=='BEP20'?'selected':''}>BEP20</option></select><input id="pad" placeholder="USDT wallet address" value="${e(p.addr||'')}">`}[m];
 modal(`<h3>Payment details</h3><p class="mut" style="margin:4px 0 10px">Saving or changing details needs Admin verification before you can withdraw.</p>${tabs}${f}<button class="btn full" onclick="savePay()">Save details</button>`);
};
window.ifsc=()=>{const c=BANKS[val('pb')];if(c)$('pi').value=c+'0'};
window.savePay=async()=>{
 const m=S.pm;let d;
 if(m=='bank'){d={bank:val('pb'),acc:val('pa'),ifsc:val('pi').toUpperCase(),mobile:val('pm'),name:val('pn')};
  if(!d.bank||d.acc.length<8)return toast('Select bank and enter account number');if(d.acc!=val('pa2'))return toast('Account numbers do not match');
  if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(d.ifsc))return toast('Invalid IFSC code');if(!mob(d.mobile)||d.name.length<3)return toast('Enter linked mobile and name')}
 else if(m=='upi'){d={id:val('pu'),name:val('pn')};if(!/^[\w.\-]{2,}@[\w]{2,}$/.test(d.id)||d.name.length<3)return toast('Enter valid UPI ID and name')}
 else{d={net:val('pw'),addr:val('pad')};if(d.addr.length<26)return toast('Enter valid wallet address')}
 try{await updateDoc(doc(db,'users',S.uid),{['pay.'+m]:d,payStatus:'pending'});closeM();toast('Saved. Waiting for Admin verification')}catch(x){toast(x.message)}
};

/* ---- withdraw ---- */
window.wd_=()=>{
 const u=S.u;
 if(u.payStatus=='none'||!Object.keys(u.pay||{}).length)return modal(`<h3>Payment details not added</h3><p class="mut" style="margin:8px 0 14px">Please add payment details to withdraw.</p><button class="btn full" onclick="payDet()">Add payment details</button>`);
 if(u.payStatus!='verified')return modal(`<h3>Verification pending</h3><p class="mut" style="margin:8px 0 14px">Admin is verifying your payment details. You can withdraw once verified.</p><button class="btn full" onclick="closeM()">OK</button>`);
 const ms=Object.keys(u.pay);
 modal(`<h3>Withdraw</h3><p class="mut" style="margin:4px 0 10px">Available ${R(u.balance)} · Minimum ${R0(MIN_WD)}</p><select id="wm">${ms.map(m=>`<option value="${m}">${{bank:'Bank account',upi:'UPI',usdt:'USDT'}[m]}</option>`).join('')}</select>
 <label class="c"><input type="radio" name="wt" value="all" checked onchange="$('wa').style.display='none'"> Withdraw all</label><label class="c"><input type="radio" name="wt" value="c" onchange="$('wa').style.display='block'"> Custom amount</label>
 <input id="wa" type="number" inputmode="decimal" placeholder="Amount" style="display:none"><button class="btn full" onclick="wdGo()">Request withdrawal</button>`);
};
window.wdGo=async()=>{
 const u=S.u,all=document.querySelector('input[name=wt]:checked').value=='all',amt=all?u.balance:Math.round(Number(val('wa'))*100)/100,m=val('wm');
 if(!(amt>=MIN_WD))return toast('Minimum withdrawal is '+R0(MIN_WD));if(amt>u.balance)return toast('Insufficient balance');
 try{const b=writeBatch(db);b.set(doc(collection(db,'withdrawals')),{userId:S.uid,userName:u.name,amount:amt,method:m,details:u.pay[m],status:'pending',createdAt:serverTimestamp()});b.update(doc(db,'users',S.uid),{balance:Math.round((u.balance-amt)*100)/100});await b.commit();closeM();toast('Withdrawal requested')}catch(x){toast(x.message)}
};

/* ---- chat (user + admin) ---- */
window.chat=(uid,name,mobile,adm)=>{
 modal(`<h3>${adm?e(name)+' · '+mobile:'Support chat'}</h3><div class="msgs" id="ms"></div><div class="row"><input id="mt" placeholder="Type a message" style="margin:0"><button class="btn" onclick="send_('${uid}','${e(name)}','${mobile}',${adm})">Send</button></div><br><button class="btn s full" onclick="send_('${uid}','${e(name)}','${mobile}',${adm},1)">${adm?'Ask user to call back':'Request a call'}</button>`);
 chatSub=onSnapshot(collection(db,'chats',uid,'msgs'),s=>{const r=s.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);$('ms').innerHTML=r.map(m=>`<div class="m ${m.type=='call'?'call':''} ${(m.from=='admin')==adm?'me':''}">${m.type=='call'?'📞 ':''}${e(m.text)}</div>`).join('');$('ms').scrollTop=1e6});
};
window.send_=async(uid,name,mobile,adm,call)=>{
 const text=call?(adm?'Admin requests a call back':'Call request: please call me on '+mobile):val('mt');if(!text)return;
 try{await addDoc(collection(db,'chats',uid,'msgs'),{from:adm?'admin':'user',text,type:call?'call':'text',t:Date.now()});await setDoc(doc(db,'chats',uid),{name,mobile,last:text,from:adm?'admin':'user',t:Date.now()},{merge:true});if(!call)$('mt').value=''}catch(x){toast(x.message)}
};

/* ================= ADMIN ================= */
const AT=['users','apps','banners','leads','withdraw','chats','videos'];
function adminPage(){
 const t=S.at,U=id=>S.users.find(x=>x.id==id)||{};let b='';
 if(t=='users'){
  const q=S.q.toLowerCase();
  b=`<input id="aq" placeholder="Search name / mobile / email" value="${e(S.q)}" oninput="S.q=this.value;clearTimeout(window._s);window._s=setTimeout(render,400)">`+
  S.users.filter(u=>!q||(u.name+u.mobile+u.email).toLowerCase().includes(q)).map(u=>`<div class="card"><b>${e(u.name)}</b> ${u.payStatus=='verified'?'✅':''}<br><small>${u.mobile} · ${e(u.email)}<br>Invite: ${u.code} | Referred by: ${e(U(u.referredBy).name||'-')} | Commission: ${u.commission}%<br>Pay: ${e(JSON.stringify(u.pay||{}))} (${u.payStatus})</small><h2>${R(u.balance)}</h2>
  <div class="acts"><button class="btn sm" onclick="bal('${u.id}',1)">+ Balance</button><button class="btn sm s" onclick="bal('${u.id}',-1)">- Balance</button><button class="btn sm g" onclick="vfy('${u.id}')">${u.payStatus=='verified'?'Unverify':'Verify'}</button><button class="btn sm s" onclick="com('${u.id}')">Commission %</button><button class="btn sm s" onclick="chat('${u.id}','${e(u.name)}','${u.mobile}',true)">Chat</button><button class="btn sm s" onclick="S.lf='${u.id}';S_('at','leads')">Leads</button><button class="btn sm r" onclick="del('users','${u.id}')">Delete</button></div></div>`).join('');
 }else if(t=='apps'){
  b=`<div class="card"><h4 style="margin-bottom:10px">Add offer / app</h4><input id="an" placeholder="Name"><input id="al" placeholder="Register link (https://...)"><input id="ar" type="number" placeholder="Reward amount ₹"><select id="ac">${CATS.slice(1).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select><select id="av"><option value="mobile">Confirm customer by mobile number</option><option value="gmail">Confirm customer by Gmail</option></select><input id="ai" placeholder="Icon image link (optional)"><input id="ad" placeholder="Short description"><textarea id="at" rows="3" placeholder="Details (shown in i button)"></textarea><textarea id="atc" rows="3" placeholder="Terms & conditions"></textarea><button class="btn" onclick="addApp()">Post</button></div>`+
  S.apps.map(a=>`<div class="card row"><div><b>${e(a.name)}</b><br><small>${a.category} · ${R0(a.reward)} · ${a.verifyBy}</small></div><button class="btn sm r" onclick="del('apps','${a.id}')">Delete</button></div>`).join('');
 }else if(t=='banners'){
  b=`<div class="card"><h4 style="margin-bottom:10px">Add banner</h4><input id="bi" placeholder="Banner image link"><input id="bl" placeholder="Click link (optional)"><button class="btn" onclick="addB()">Post banner</button></div>`+
  S.banners.map(x=>`<div class="card"><img src="${e(x.img)}" style="width:100%;border-radius:10px"><br><br><button class="btn sm r" onclick="del('banners','${x.id}')">Delete</button></div>`).join('');
 }else if(t=='leads'){
  const L=S.leads.filter(l=>!S.lf||l.userId==S.lf).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
  b=(S.lf?`<button class="btn sm s" onclick="S.lf=null;render()">Show all leads</button><br><br>`:'')+L.map(l=>`<div class="card"><div class="row"><b>${e(l.appName)}</b><span class="tag ${l.status}">${l.status}</span></div><small>Customer: ${e(l.contact)} (${l.verifyBy})<br>By: ${e(U(l.userId).name||'?')} ${U(l.userId).mobile||''} · ${dt(l.createdAt)}</small><br><b>${R0(l.reward)}</b> ${l.paid?'<span class="tag paid">paid</span>':''}
  <div class="acts"><button class="btn sm s" onclick="ls('${l.id}','progress')">In progress</button><button class="btn sm s" onclick="ls('${l.id}','rejected')">Reject</button><button class="btn sm g" onclick="pay('${l.id}')">Success + release payout</button><button class="btn sm r" onclick="del('leads','${l.id}')">Delete</button></div></div>`).join('')||'<p class="mut">No leads.</p>';
 }else if(t=='withdraw'){
  b=[...S.wds].sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0)).map(w=>`<div class="card"><div class="row"><b>${R(w.amount)} ${e(w.userName)}</b><span class="tag ${w.status}">${w.status}</span></div><small>${w.method}: ${e(JSON.stringify(w.details))}<br>${dt(w.createdAt)}</small>${w.status=='pending'?`<div class="acts"><button class="btn sm g" onclick="ws('${w.id}','paid')">Mark paid</button><button class="btn sm r" onclick="ws('${w.id}','rejected')">Reject + refund</button></div>`:''}</div>`).join('')||'<p class="mut">No requests.</p>';
 }else if(t=='chats'){
  b=[...S.chats].sort((x,y)=>y.t-x.t).map(c=>`<div class="card" onclick="chat('${c.id}','${e(c.name)}','${c.mobile}',true)"><b>${e(c.name)}</b> <small>${c.mobile}</small><br><small>${e(c.last||'')}</small></div>`).join('')||'<p class="mut">No chats.</p>';
 }else{
  b=`<div class="card"><h4 style="margin-bottom:10px">Add training video</h4><input id="vt" placeholder="Title"><input id="vu" placeholder="YouTube link"><button class="btn" onclick="addV()">Post video</button></div>`+S.vids.map(v=>`<div class="card row"><b>${e(v.title)}</b><button class="btn sm r" onclick="del('videos','${v.id}')">Delete</button></div>`).join('');
 }
 $('app').innerHTML=`<div class="top"><b>Admin panel</b><a class="btn sm s" style="text-decoration:none" href="#" onclick="location.hash='';return false">User view</a><button class="btn sm s" onclick="logout_()">Logout</button></div><div class="abar">${AT.map(a=>`<button class="chip ${t==a?'on':''}" onclick="S_('at','${a}')">${a[0].toUpperCase()+a.slice(1)}</button>`).join('')}</div><div class="wrap">${b}</div>`;
}
const T_=async(f)=>{try{await f()}catch(x){toast(x.message)}};
window.bal=(id,s)=>{const a=Number(prompt('Amount ₹'));if(a>0)T_(()=>updateDoc(doc(db,'users',id),{balance:increment(s*a)}))};
window.vfy=id=>{const u=S.users.find(x=>x.id==id);T_(()=>updateDoc(doc(db,'users',id),{payStatus:u.payStatus=='verified'?'pending':'verified'}))};
window.com=id=>{const c=Number(prompt('Commission % for this user'));if(c>=0&&c<=100)T_(()=>updateDoc(doc(db,'users',id),{commission:c}))};
window.del=(c,id)=>{if(confirm('Delete? (User delete removes the profile only; remove login from Firebase Authentication too)'))T_(()=>deleteDoc(doc(db,c,id)))};
window.addApp=()=>{const d={name:val('an'),link:val('al'),reward:Number(val('ar')),category:val('ac'),verifyBy:val('av'),icon:val('ai'),desc:val('ad'),details:val('at'),terms:val('atc')};if(!d.name||!/^https?:\/\//.test(d.link)||!(d.reward>=0))return toast('Name, valid link and reward required');T_(async()=>{await addDoc(collection(db,'apps'),d);toast('Posted');S.at='apps';render()})};
window.addB=()=>{if(!/^https?:\/\//.test(val('bi')))return toast('Enter image link');T_(async()=>{await addDoc(collection(db,'banners'),{img:val('bi'),link:val('bl'),t:Date.now()});toast('Banner posted')})};
window.addV=()=>{if(!val('vt')||!val('vu'))return toast('Title and link required');T_(async()=>{await addDoc(collection(db,'videos'),{title:val('vt'),url:val('vu'),t:Date.now()});toast('Video posted')})};
window.ls=(id,s)=>T_(()=>updateDoc(doc(db,'leads',id),{status:s}));
window.pay=id=>{const l=S.leads.find(x=>x.id==id);if(l.paid)return toast('Already paid');if(!confirm('Release '+R0(l.reward)+' to user wallet?'))return;
 T_(async()=>{const b=writeBatch(db),u=S.users.find(x=>x.id==l.userId);b.update(doc(db,'leads',id),{status:'success',paid:true});
  if(u){b.update(doc(db,'users',u.id),{balance:increment(l.reward),earned:increment(l.reward)});const r=S.users.find(x=>x.id==u.referredBy);if(r&&r.commission>0){const c=Math.round(l.reward*r.commission)/100;b.update(doc(db,'users',r.id),{balance:increment(c),earned:increment(c)})}}
  await b.commit();toast('Payout released')})};
window.ws=(id,s)=>{const w=S.wds.find(x=>x.id==id);T_(async()=>{const b=writeBatch(db);b.update(doc(db,'withdrawals',id),{status:s});if(s=='rejected')b.update(doc(db,'users',w.userId),{balance:increment(w.amount)});await b.commit()})};

Object.assign(window,{S,$});
render();
</script></body></html>
